# Сборка agent.exe для Windows и прогон тестов.
# Запускается при каждой отправке кода на GitHub, а также вручную
# (вкладка Actions → «Сборка и тесты» → Run workflow).
# Готовый agent.exe: открыть запуск → внизу раздел Artifacts → agent-windows.

name: Сборка и тесты

on:
  push:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8   # кириллица в выводе на Windows
  PYTHONUTF8: "1"

jobs:
  tests-mac:
    name: Тесты (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-teacher.txt -r requirements-dev.txt
      - run: python -m pytest -v --junitxml=report.xml || (python tools/ci_annotate.py report.xml; exit 1)

  build-windows:
    name: Тесты и сборка agent.exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: write        # чтобы публиковать релизы
    env:
      SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyinstaller==6.15.0
      - name: Тесты (включая DPAPI, Known Folders, mutex, автозапуск)
        shell: bash
        run: python -m pytest -v --junitxml=report.xml || (python tools/ci_annotate.py report.xml; exit 1)
      - name: Сборка agent.exe
        run: >
          pyinstaller --onefile --noconsole --clean --name agent
          --paths . --collect-submodules zeroconf --collect-submodules comtypes
          --runtime-hook tools/rthook_fresh_unpack.py
          agent/run_agent.py
      - name: Проверка, что exe собрался
        shell: pwsh
        run: |
          $f = Get-Item dist/agent.exe
          "Размер agent.exe: {0:N1} МБ" -f ($f.Length / 1MB)
      - name: Самопроверка собранного agent.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/agent.exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          $r = Get-Content selftest.txt
          "Результат: $r"
          if (-not $r.StartsWith("ok ")) { exit 1 }
      - name: Самопроверка запуска «по наследству» (как при самообновлении со старой версии)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/agent.exe -ArgumentList "--ci-inherit-test", "inherit.txt" -Wait -PassThru
          $r = Get-Content inherit.txt
          "Результат: $r"
          if (-not $r.StartsWith("ok ")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: dist/agent.exe
          retention-days: 30
      - name: Есть ли ключ подписи
        shell: bash
        env:
          KEY_IN_VARS: ${{ vars.AGENT_SIGNING_KEY != '' }}
        run: |
          if [ "$KEY_IN_VARS" = "true" ]; then echo "::warning title=Ключ лежит в Variables::Ключ добавлен во вкладку Variables, а нужен во вкладке Secrets. Удалите его из Variables и добавьте в Secrets."; fi
          if [ -n "$SIGNING_KEY" ]; then echo "Ключ подписи найден"
          else echo "::warning title=Ключ подписи не найден::Добавьте секрет AGENT_SIGNING_KEY в Settings → Secrets and variables → Actions → Secrets. Релиз для автообновления не будет опубликован."; fi
      # Подписанный релиз для автообновления ноутбуков.
      # Создаётся только из ветки main, только если задан секрет AGENT_SIGNING_KEY
      # и только если релиза с такой версией ещё нет (версия — в agent/__init__.py).
      - name: Подпись и публикация релиза
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import agent; print(agent.__version__)")
          if gh release view "agent-v$VER" >/dev/null 2>&1; then
            echo "Релиз agent-v$VER уже есть — пропускаю (увеличьте версию в agent/__init__.py)"
            exit 0
          fi
          python tools/sign_release.py dist/agent.exe "$VER" dist/
          gh release create "agent-v$VER" dist/agent.exe dist/manifest.json dist/manifest.sig \
            --title "Агент $VER" --notes "Автоматическая сборка из $GITHUB_SHA. Подписано ключом обновлений."

      # ----- Приложение учителя для Windows (админский ноутбук) -----
      - name: Сборка «Айтишкино.exe» (приложение учителя)
        run: >
          pyinstaller --onefile --noconsole --clean --name Aitishkino
          --icon teacher/web/icon.ico --paths . --collect-submodules zeroconf
          --add-data "teacher/web;teacher/web"
          --exclude-module webview --exclude-module keyring --exclude-module clr --exclude-module pythonnet
          teacher/run_teacher.py
      - name: Самопроверка собранного Айтишкино.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Aitishkino.exe -ArgumentList "--selftest", "tsel.txt" -Wait -PassThru
          $r = Get-Content tsel.txt
          "Результат: $r"
          if (-not $r.StartsWith("ok ")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: aitishkino-windows
          path: dist/Aitishkino.exe
          retention-days: 30
      # Публикуем приложение учителя (подпись не нужна — это не автообновляемый агент)
      - name: Публикация «Айтишкино.exe»
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import teacher; print(teacher.__version__)")
          if gh release view "teacher-v$VER" >/dev/null 2>&1; then
            echo "Релиз teacher-v$VER уже есть — пропускаю (увеличьте версию в teacher/__init__.py)"
            exit 0
          fi
          # --latest=false: «последним» на GitHub должен оставаться релиз агента —
          # по нему панели учителей находят обновления для ноутбуков
          gh release create "teacher-v$VER" dist/Aitishkino.exe --latest=false \
            --title "Айтишкино (приложение учителя) $VER" \
            --notes "Приложение учителя для Windows. Скачайте Aitishkino.exe и запустите. Собрано из $GITHUB_SHA."
      - name: Релиз агента — «последний» (для автообновления ноутбуков)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import agent; print(agent.__version__)")
          if gh release view "agent-v$VER" >/dev/null 2>&1; then gh release edit "agent-v$VER" --latest; fi
