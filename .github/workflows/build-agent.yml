# Сборка agent.exe для Windows и прогон тестов.
# Запускается при каждой отправке кода на GitHub, а также вручную
# (вкладка Actions → «Сборка и тесты» → Run workflow).
# Готовый agent.exe: открыть запуск → внизу раздел Artifacts → agent-windows.

name: Сборка и тесты

on:
  push:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8   # кириллица в выводе на Windows
  PYTHONUTF8: "1"

jobs:
  tests-mac:
    name: Тесты (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-teacher.txt -r requirements-dev.txt
      - run: python -m pytest -v --junitxml=report.xml || (python tools/ci_annotate.py report.xml; exit 1)

  build-windows:
    name: Тесты и сборка agent.exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: write        # чтобы публиковать релизы
    env:
      SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyinstaller==6.15.0
      - name: Тесты (включая DPAPI, Known Folders, mutex, автозапуск)
        shell: bash
        run: python -m pytest -v --junitxml=report.xml || (python tools/ci_annotate.py report.xml; exit 1)
      - name: Сборка agent.exe
        run: >
          pyinstaller --onefile --noconsole --clean --name agent
          --paths . --collect-submodules zeroconf
          agent/run_agent.py
      - name: Проверка, что exe собрался
        shell: pwsh
        run: |
          $f = Get-Item dist/agent.exe
          "Размер agent.exe: {0:N1} МБ" -f ($f.Length / 1MB)
      - name: Самопроверка собранного agent.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/agent.exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          $r = Get-Content selftest.txt
          "Результат: $r"
          if (-not $r.StartsWith("ok ")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: dist/agent.exe
          retention-days: 30
      - name: Есть ли ключ подписи
        shell: bash
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "Ключ подписи найден"
          else echo "::warning title=Ключ подписи не найден::Добавьте секрет AGENT_SIGNING_KEY в Settings → Secrets and variables → Actions → Secrets. Релиз для автообновления не будет опубликован."; fi
      # Подписанный релиз для автообновления ноутбуков.
      # Создаётся только из ветки main, только если задан секрет AGENT_SIGNING_KEY
      # и только если релиза с такой версией ещё нет (версия — в agent/__init__.py).
      - name: Подпись и публикация релиза
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import agent; print(agent.__version__)")
          if gh release view "agent-v$VER" >/dev/null 2>&1; then
            echo "Релиз agent-v$VER уже есть — пропускаю (увеличьте версию в agent/__init__.py)"
            exit 0
          fi
          python tools/sign_release.py dist/agent.exe "$VER" dist/
          gh release create "agent-v$VER" dist/agent.exe dist/manifest.json dist/manifest.sig \
            --title "Агент $VER" --notes "Автоматическая сборка из $GITHUB_SHA. Подписано ключом обновлений."
