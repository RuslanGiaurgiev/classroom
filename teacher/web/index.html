<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Компьютерный класс</title>
  <link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Компьютерный класс</h1>
    <div class="conn" id="conn">подключение…</div>
    <div class="spacer"></div>
    <div class="mac-addr" id="macAddr"></div>
    <button class="btn primary" id="btnAdd">+ Добавить ноутбук</button>
  </header>

  <main>
    <section class="panel">
      <h2>Открыть сайт</h2>
      <div class="row">
        <textarea id="urls" rows="2" placeholder="Адрес сайта, например scratch.mit.edu (можно несколько — каждый с новой строки)"></textarea>
      </div>
      <div class="row">
        <label>Браузер:
          <select id="browser">
            <option value="default">Браузер по умолчанию на ноутбуке</option>
            <option value="chrome">Google Chrome</option>
            <option value="yandex">Яндекс Браузер</option>
            <option value="edge">Microsoft Edge</option>
          </select>
        </label>
        <div class="spacer"></div>
        <button class="btn" id="btnOpenSelected">Открыть на выбранных</button>
        <button class="btn primary" id="btnOpenAll">Открыть на всех</button>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <h2>Ноутбуки</h2>
        <div class="spacer"></div>
        <span class="muted" id="summary"></span>
        <label class="selall"><input type="checkbox" id="selectAll"> выбрать все</label>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty muted" id="empty" hidden>Пока нет ни одного ноутбука. Нажмите «Добавить ноутбук».</p>
    </section>

    <section class="panel">
      <h2>Журнал</h2>
      <ul class="log" id="log"></ul>
    </section>
  </main>

  <!-- Окно добавления ноутбука -->
  <div class="modal" id="modalAdd" hidden>
    <div class="modal-box">
      <h2>Добавить ноутбук</h2>
      <div id="addStep1">
        <p>Введите номер ноутбука с наклейки на мониторе:</p>
        <input id="laptopNumber" type="text" maxlength="10" placeholder="Например, 5">
        <div class="row">
          <div class="spacer"></div>
          <button class="btn" data-close>Отмена</button>
          <button class="btn primary" id="btnMakeCode">Получить код</button>
        </div>
      </div>
      <div id="addStep2" hidden>
        <p>На ноутбуке <b id="codeNumber"></b> запустите агент и введите этот код:</p>
        <div class="code" id="codeText"></div>
        <p class="muted">Код одноразовый, действует ещё <span id="codeTimer"></span>.</p>
        <div class="row">
          <div class="spacer"></div>
          <button class="btn primary" data-close>Готово</button>
        </div>
      </div>
      <p class="error" id="addError"></p>
    </div>
  </div>

  <script src="/ui/static/app.js"></script>
</body>
</html>
